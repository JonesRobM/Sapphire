[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sapphire-nano"
version = "1.1.0"
description = "A pythonic post-processing environment for the analysis of metallic nanoalloys"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Robert Michael Jones", email = "Robert.M.Jones@kcl.ac.uk" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "ase>=3.22",
    "pandas>=1.5",
    "networkx>=3.0",
]

[project.optional-dependencies]
plot        = ["matplotlib>=3.7", "seaborn>=0.12"]
changepoint = ["ruptures>=1.1"]
ml          = ["scikit-learn>=1.2", "joblib>=1.2"]
cna         = ["ovito>=3.8"]
light       = ["pygdm2>=1.1"]
quote       = ["wikiquote>=0.1"]
mlpot       = ["mace-torch>=0.3"]          # machine-learned potentials (MACE foundation models); pulls in torch
notebooks   = ["jupyter", "ipykernel"]
dev         = ["pytest>=7", "ruff>=0.4", "pre-commit"]
docs        = ["mkdocs>=1.6,<2", "mkdocs-material>=9", "mkdocstrings[python]>=0.25", "mkdocs-jupyter>=0.24"]
all         = ["sapphire-nano[plot,changepoint,ml,light,quote,notebooks]"]

[project.urls]
Homepage = "https://github.com/JonesRobM/Sapphire"
Group    = "http://balettogroup.org"

[tool.setuptools]
package-dir = { "" = "main" }

[tool.setuptools.packages.find]
where   = ["main"]
include = ["Sapphire*"]

[tool.setuptools.package-data]
"Sapphire.Potentials" = ["*.eam.alloy", "*.eam.fs", "*.eam", "*.set", "*.adp.txt"]
"Sapphire.Tutorials"  = ["**/*.ipynb", "**/*.xyz", "**/*.xyz.gz", "**/*.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["legacy", "main/Sapphire/Tutorials"]

[tool.ruff.lint]
# Defect-class rules only for now; style (E/W) is a later, separate pass.
select = ["F", "E9", "B"]
ignore = ["B905", "B008", "B006", "B007", "B028", "B904"]

[tool.pytest.ini_options]
testpaths = ["tests"]
